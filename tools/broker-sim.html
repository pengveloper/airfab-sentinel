<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavrel 시뮬레이터</title>
<style>
body{margin:0;padding:24px;background:#05080d;color:#e8eef6;font:15px/1.55 "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;max-width:70ch}
h1{font-size:20px;margin:0 0 8px}p{color:#8c9db3;margin:0 0 16px}
label{display:block;font-size:12px;color:#8c9db3;margin-bottom:10px}
input{display:block;font:inherit;color:#e8eef6;background:#121b27;border:1px solid #1f2c3d;border-radius:4px;padding:7px 9px;margin-top:4px;width:100%;max-width:320px}
button{font:inherit;background:#b9a8ff;border:0;border-radius:6px;padding:9px 14px;font-weight:500;cursor:pointer;color:#120b2b}
#out{margin-top:16px;font-family:Consolas,monospace;font-size:13px;color:#b9a8ff}
</style>
</head>
<body>
<h1>Wavrel 시뮬레이터</h1>
<p>보드 없이 콘솔을 확인할 때만 씁니다. 실제 펌웨어와 같은 토픽 모양으로 가짜 메시지를 보내고, 콘솔에는 "시뮬레이터 데이터 포함" 표시가 뜹니다. 이 창을 닫으면 표시도 꺼집니다.</p>
<form id="f">
  <label for="url">브로커 WebSocket<input id="url" value="ws://localhost:9001"></label>
  <label for="user">사용자<input id="user" value="lab" autocomplete="username"></label>
  <label for="pass">비밀번호<input id="pass" type="password" autocomplete="current-password"></label>
  <button type="submit">가짜 메시지 보내기 시작</button>
</form>
<div id="out">대기 중</div>
<script src="../console/vendor/mqtt.min.js"></script>
<script>
(()=>{const $=s=>document.querySelector(s),out=$('#out');let sent=0;
$('#f').addEventListener('submit',e=>{e.preventDefault();
  const c=mqtt.connect($('#url').value.trim(),{username:$('#user').value,password:$('#pass').value,will:{topic:'lab/sim/active',payload:'0',retain:true,qos:1},clientId:'wavrel-sim-'+Math.random().toString(16).slice(2,8)});
  c.on('error',err=>{out.textContent='연결 실패: '+err.message;});
  c.on('connect',()=>{out.textContent='보내는 중';
    c.publish('lab/sim/active','1',{retain:true,qos:1});
    const id='51a0000000000001',base='espectre/v1/devices/'+id;
    // 보관(retain) 없이 주기적으로 보냅니다. 도구를 닫은 뒤 브로커에 가짜 값이 남지 않게 하기 위해서입니다.
    const meta=()=>{c.publish(base+'/sensing',JSON.stringify({enabled:true,ready:true,calibrating:false,mode:'sensing',detector:'lightweight',threshold:0.5}));c.publish(base+'/health',JSON.stringify({status:'online'}));
      c.publish('espresense/rooms/office/status','online');c.publish('espresense/rooms/living/status','online');};meta();setInterval(meta,5000);
    let t=0,burst=0;
    setInterval(()=>{t+=0.2;if(Math.random()<0.02)burst=1;burst*=0.93;const score=0.08+Math.random()*0.06+burst*1.4;
      c.publish(base+'/motion',JSON.stringify({timestamp_ms:Math.round(t*1000),state:score>0.5?'motion':'idle',score:+score.toFixed(4)}));sent++;},200);
    setInterval(()=>{const x=4+3*Math.sin(t*0.2),dO=Math.abs(x-1)+0.4+Math.random()*0.3,dL=Math.abs(x-7)+0.4+Math.random()*0.3;
      const pub=(room,d)=>c.publish('espresense/devices/sim:phone/'+room,JSON.stringify({id:'sim:phone',name:'Sim Phone',distance:+d.toFixed(2),rssi:Math.round(-52-d*7)}));
      pub('office',dO);pub('living',dL);
      c.publish('espresense/devices/aabbccddeeff/office',JSON.stringify({id:'aabbccddeeff',distance:+(2+Math.random()).toFixed(2),rssi:-70}));sent+=3;out.textContent='보낸 메시지 '+sent;},1000);
    window.addEventListener('beforeunload',()=>{c.publish('lab/sim/active','0',{retain:true});});
  });});
})();
</script>
</body>
</html>
