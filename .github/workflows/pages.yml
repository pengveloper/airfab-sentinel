# The demo and the privacy policy moved to wavrel.com. GitHub Pages keeps the old addresses
# working: each one sends the visitor to the same page on wavrel.com, query string included.
# Runs only when the repository is public, because Pages on a private repository needs a paid plan.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Write the redirects
        run: python3 .github/scripts/pages_redirects.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
