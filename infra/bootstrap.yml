AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Sentinel Lab, one-time setup. Lets GitHub Actions in pengveloper/airfab-sentinel deploy the
  website and the alert relay without stored AWS keys (OpenID Connect). The role can only be
  assumed by jobs that run in the repository's "aws" environment, and it can only touch
  resources named sentinel-*.

Parameters:
  Repository:
    Type: String
    Default: pengveloper/airfab-sentinel
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the account's existing token.actions.githubusercontent.com provider, if there is
      one (an account can hold only one). Leave empty to create it.

Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sentinel-github-deploy
      Description: Deploys Sentinel Lab from GitHub Actions (environment "aws" only)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:aws
      Policies:
        - PolicyName: sentinel-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/sentinel-*/*
              - Sid: StackReads
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:DescribeStacks
                Resource: '*'
              - Sid: Buckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::sentinel-*
                  - !Sub arn:${AWS::Partition}:s3:::sentinel-*/*
              - Sid: Website
                Effect: Allow
                Action:
                  - cloudfront:*
                  - acm:*
                Resource: '*'
              - Sid: RelayServer
                Effect: Allow
                Action:
                  - ec2:*
                  - ssm:*
                  - logs:*
                  - cloudwatch:*
                Resource: '*'
              - Sid: RelayServerRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sentinel-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/sentinel-*
              - Sid: PassOnlyToEc2
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sentinel-*
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: WhoAmI
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
