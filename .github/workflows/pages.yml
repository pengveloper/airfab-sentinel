# Publishes the simulator demo and the privacy policy to GitHub Pages.
# Runs only when the repository is public, because Pages on a private repository needs a paid plan.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install without running package scripts
        run: npm ci --ignore-scripts
      - name: Bundle typefaces
        run: node desktop/scripts/fonts.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site/privacy
          cp -r console/. _site/
          cp web/privacy/index.html _site/privacy/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
