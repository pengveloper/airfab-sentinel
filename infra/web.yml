AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Wavrel website: a private S3 bucket served only through CloudFront (origin access
  control), with HTTPS on the project's own domain and strict security headers. Deployed in
  us-east-1 next to its certificate.

Parameters:
  DomainName:
    Type: String
    Default: wavrel.com
  CertificateArn:
    Type: String
    Description: Output of the wavrel-web-cert stack

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub wavrel-web-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: drop-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: project
          Value: wavrel

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: wavrel-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # www -> apex; /demo/ -> /demo/index.html; /demo -> /demo/ (S3 behind CloudFront has no index documents).
  IndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: wavrel-web-index
      AutoPublish: true
      FunctionConfig:
        Comment: Directory index and trailing slash
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function query(r) {
          var parts = [];
          Object.keys(r.querystring).forEach(function (k) {
            var q = r.querystring[k];
            (q.multiValue || [q]).forEach(function (v) {
              parts.push(v.value === '' ? k : k + '=' + v.value);
            });
          });
          return parts.length ? '?' + parts.join('&') : '';
        }
        function moved(location) {
          return { statusCode: 301, statusDescription: 'Moved Permanently',
            headers: { location: { value: location } } };
        }
        function handler(event) {
          var r = event.request;
          var uri = r.uri;
          var host = r.headers.host && r.headers.host.value;
          if (host && host.indexOf('www.') === 0) return moved('https://' + host.slice(4) + uri + query(r));
          if (uri.endsWith('/')) { r.uri = uri + 'index.html'; return r; }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) return moved(uri + '/' + query(r));
          return r;
        }

  Headers:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: wavrel-web-headers
        Comment: Same content policy as the desktop app, plus transport and framing rules
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
              font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:;
              frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none';
              frame-ancestors 'none'
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), interest-cohort=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Wavrel website
        Aliases: [!Ref DomainName, !Sub 'www.${DomainName}']
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref Headers
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # Without list permission S3 answers 403 for a missing key.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: project
          Value: wavrel

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub ${Bucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
