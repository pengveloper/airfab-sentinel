AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Sentinel Lab website certificate. Must be in us-east-1 for CloudFront. The domain's DNS is
  on Cloudflare, so the validation record is added there by hand; the stack finishes when
  ACM sees it.

Parameters:
  DomainName:
    Type: String
    Default: sentinel.jason-jang.dev

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      KeyAlgorithm: EC_prime256v1
      Tags:
        - Key: project
          Value: sentinel-lab

Outputs:
  CertificateArn:
    Value: !Ref Certificate
